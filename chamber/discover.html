<!doctype html>

    <meta
      property="og:title"
      content="Discover Oroquieta City - Landmarks & Attractions"

      property="og:description"
      content="Explore Oroquieta City's Discover section featuring historical landmarks, beaches, plazas, markets, and arenas. Plan your visit and experience the heart of the city."
    />
    <meta
      property="og:image"
      content="https://jerwinronda.github.io/wdd231/images/oroq-plaza.webp"

    <!-- Favicon -->

    <!-- Preconnect & preload Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:wght@400;500&display=swap"
      onload="this.rel = 'stylesheet'"
    />

    <!-- Inline critical CSS for header and nav -->
    <style>
      body {
        margin: 0;
        font-family: "Open Sans", sans-serif;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 1rem;
      }
      .header-left {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .site-logo {
        width: 44px;
        height: 44px;
      }
      nav.navigation {
        display: flex;
        list-style: none;
        gap: 1.5rem;
        margin: 0;
        padding: 0;
      }
      .discover-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2rem;
        padding: 0 1rem;
      }
    </style>

    <!-- Non-critical CSS: preload + defer -->
    <link
      rel="preload"
      href="styles/normalize.css"
      as="style"
      onload="this.rel = 'stylesheet'"
    />
    <link
      rel="preload"
      href="styles/small.css"
      as="style"
      onload="this.rel = 'stylesheet'"
    />
    <link
      rel="preload"
      href="styles/larger.css"
      as="style"
      onload="this.rel = 'stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="styles/normalize.css" />
      <link rel="stylesheet" href="styles/small.css" />
      <link rel="stylesheet" href="styles/larger.css" />

        <nav>
          <ul class="navigation">
            <li><a href="index.html">Home</a></li>

            </li>

        <button id="menu-button" class="hambutton" aria-label="Menu"></button>

    <main>
      <section id="visitor-message"></section>
      <section class="discover-grid"></section>
    </main>
    <footer>

        <p id="footer-site-name">Oroquieta City Chamber of Commerce</p>
        <p>Oroquieta City, Misamis Occidental</p>
        <p>oroquietacc@gmail.com</p>
        <p>+639530496669</p>

      <div class="social-icons">

      <div>
        <p>WDD231 Class Project</p>
