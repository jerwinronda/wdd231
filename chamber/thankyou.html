<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Thank You</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      .summary {
        background: #f4f4f4;
        padding: 1.5rem;
        border-radius: 8px;
        max-width: 600px;
      }

      .summary p {
        margin: 0.5rem 0;
      }
    </style>
    <script src="scripts/thankyou.js" defer></script>
  </head>

  <body>
    <header>
      <!-- chamber header -->
    </header>

    <nav>
      <!-- chamber nav -->
    </nav>

    <main>
      <h1>Thank You for Joining!</h1>
      <p>We appreciate your interest in the Chamber of Commerce.</p>

      <section class="summary">
        <h2>Your Submitted Information</h2>
        <p><strong>First Name:</strong> <span id="fname"></span></p>
        <p><strong>Last Name:</strong> <span id="lname"></span></p>
        <p><strong>Email:</strong> <span id="email"></span></p>
        <p><strong>Phone:</strong> <span id="phone"></span></p>
        <p><strong>Business:</strong> <span id="business"></span></p>
        <p><strong>Submitted On:</strong> <span id="timestamp"></span></p>
      </section>
    </main>

    <footer>
      <!-- chamber footer -->
    </footer>
